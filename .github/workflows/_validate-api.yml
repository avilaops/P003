name: Validate API
'on':
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      full:
        type: boolean
        default: false
      publish:
        type: boolean
        default: false
    outputs:
      digest:
        description: Published registry image digest reused by this release
        value: ${{ jobs.api.outputs.digest }}
      openapi_artifact_name:
        description: Exact contract artifact from its producing attempt
        value: ${{ jobs.api.outputs.openapi_artifact_name }}
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: erp_next_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_isolated_only
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:ci_isolated_only@127.0.0.1:5432/erp_next_test
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.source_sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
    - uses: docker/login-action@v3
      if: inputs.publish
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Restore and verify the published contract
      id: published
      run: |
        python3 scripts/ci/published-components.py restore
        npm --prefix scripts/contracts/consumer ci --ignore-scripts --no-audit --no-fund
        npm --prefix scripts/contracts/consumer run generate
        npm --prefix scripts/contracts/consumer run check
        npm --prefix scripts/contracts/consumer test
        node scripts/fiscal/check-contract.mjs artifacts/contracts/candidate.json
    - name: Verify TypeScript API with PostgreSQL
      env:
        API_TS_TEST_ADMIN_URL: postgres://postgres:ci_isolated_only@127.0.0.1:5432/postgres
      run: |
        python3 scripts/ci/timed.py --label 'api/typescript-install' --output "artifacts/timings/$GITHUB_JOB.jsonl" -- pnpm install --frozen-lockfile --prefer-offline
        python3 scripts/ci/timed.py --label 'api/typescript-typecheck' --output "artifacts/timings/$GITHUB_JOB.jsonl" -- pnpm --filter api-ts typecheck
        python3 scripts/ci/timed.py --label 'api/typescript-tests' --output "artifacts/timings/$GITHUB_JOB.jsonl" -- pnpm --filter api-ts test
    - name: Verify inventory commands and upgrades against PostgreSQL
      env:
        API_TS_TEST_ADMIN_URL: postgres://postgres:ci_isolated_only@127.0.0.1:5432/postgres
      run: pnpm --filter api-ts exec tsx --test --test-concurrency=1 test/stock*.test.ts test/inventory*.test.ts
    - name: Apply complete SQLx history with the TypeScript migrator
      run: |
        pnpm --filter api-ts build
        node apps/api-ts/dist/migrate.js migrations
        node apps/api-ts/dist/migrate.js migrations > "$RUNNER_TEMP/migrate-second.json"
        node -e 'const {applied,existing}=require(process.argv[1]); if (applied.length || !existing) process.exit(1)' "$RUNNER_TEMP/migrate-second.json"
    - name: Check published API readiness against the migrated schema
      if: inputs.publish
      env:
        API_DIGEST: ${{ steps.published.outputs.api }}
      run: |
        set -euo pipefail
        reference="ghcr.io/avilaops/erp-next-api@$API_DIGEST"
        docker run --rm --network none --read-only --cap-drop ALL "$reference" openapi > "$RUNNER_TEMP/published-openapi.json"
        python3 -c 'import json,sys; assert json.load(open(sys.argv[1])) == json.load(open(sys.argv[2])), "Published API contract mismatch"' "$RUNNER_TEMP/published-openapi.json" artifacts/contracts/candidate.json
        docker run --detach --name published-api --network host --read-only --cap-drop ALL \
          --security-opt no-new-privileges --env DATABASE_URL --env ERP_BACKGROUND_WORKERS_ENABLED=false \
          --env API_BIND_ADDRESS=127.0.0.1:18080 "$reference"
        trap 'docker rm -f published-api >/dev/null' EXIT
        curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 1 http://127.0.0.1:18080/health/ready
    - uses: actions/upload-artifact@v4
      with:
        name: erp-openapi-${{ inputs.source_sha }}-${{ github.run_attempt }}
        path: artifacts/contracts/
        if-no-files-found: error
        retention-days: 7
    - name: Preserve measured script durations
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: timing-_validate-api-api-${{ github.run_id }}-${{ github.run_attempt }}
        path: artifacts/timings/*.jsonl
        retention-days: 7
        if-no-files-found: warn
    outputs:
      digest: ${{ steps.published.outputs.api }}
      openapi_artifact_name: erp-openapi-${{ inputs.source_sha }}-${{ github.run_attempt }}
