name: Validate API
'on':
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      full:
        type: boolean
        default: false
      publish:
        type: boolean
        default: false
      typescript_only:
        description: Skip native compilation for scoped TypeScript-only PRs
        type: boolean
        default: false
      force_native_rebuild:
        description: Bypass validated native release cache
        type: boolean
        default: false
    outputs:
      digest:
        description: Validated registry image digest
        value: ${{ jobs.api.outputs.digest }}
      openapi_artifact_name:
        description: Exact contract artifact from its producing attempt
        value: ${{ jobs.api.outputs.openapi_artifact_name }}
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: erp_next_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_isolated_only
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:ci_isolated_only@127.0.0.1:5432/erp_next_test
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.source_sha }}
        persist-credentials: false
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
    - name: Identify native release inputs
      id: native_key
      if: inputs.publish && inputs.full
      env:
        NATIVE_INPUT_HASH: ${{ hashFiles('**/*.rs', '**/Cargo.toml', '**/Cargo.lock', 'rust-toolchain.toml', '.cargo/**', '.sqlx/**', 'apps/api/**', 'apps/contract-signature-validator/**', 'migrations/**', 'queries/**', 'deploy/**', '.dockerignore', '.github/workflows/**', 'apps/api-ts/scripts/**', 'scripts/ci/**', 'scripts/contracts/**') }}
      run: node scripts/ci/native-release-cache.mjs key
    - name: Restore validated native release
      if: steps.native_key.outputs.prefix != '' && !inputs.force_native_rebuild
      uses: actions/cache/restore@v4
      with:
        path: artifacts/native-release-cache
        key: ${{ steps.native_key.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: ${{ steps.native_key.outputs.prefix }}
    - uses: docker/login-action@v3
      if: inputs.publish
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Verify native cache integrity and immutable image
      id: native_cache
      if: steps.native_key.outputs.prefix != '' && !inputs.force_native_rebuild
      env:
        SOURCE_SHA: ${{ inputs.source_sha }}
        NATIVE_INPUT_HASH: ${{ steps.native_key.outputs.input_hash }}
      run: node scripts/ci/native-release-cache.mjs restore
    - uses: dtolnay/rust-toolchain@1.99.1
      if: steps.native_cache.outputs.reuse != 'true' && (!inputs.typescript_only || inputs.full || inputs.publish)
      with:
        components: rustfmt,clippy
    - uses: Swatinem/rust-cache@v2
      if: steps.native_cache.outputs.reuse != 'true' && (!inputs.typescript_only || inputs.full || inputs.publish)
    - run: 'script_file=$(mktemp)

        trap ''rm -f -- "$script_file"'' EXIT

        cat > "$script_file" <<''ERP_TIMED_2d009b4c2fff7c14''

        cargo fmt --all --check

        ERP_TIMED_2d009b4c2fff7c14

        python3 "$GITHUB_WORKSPACE/scripts/ci/timed.py" --label ''_validate-api/api: cargo fmt --all --check'' --output "$GITHUB_WORKSPACE/artifacts/timings/$GITHUB_JOB.jsonl"
        -- bash --noprofile --norc -e -o pipefail "$script_file"

        '
      if: steps.native_cache.outputs.reuse != 'true' && (!inputs.typescript_only || inputs.full || inputs.publish)
    - run: 'script_file=$(mktemp)

        trap ''rm -f -- "$script_file"'' EXIT

        cat > "$script_file" <<''ERP_TIMED_0acdad6d86d7a115''

        cargo clippy --locked --workspace --all-targets -- -D warnings

        ERP_TIMED_0acdad6d86d7a115

        python3 "$GITHUB_WORKSPACE/scripts/ci/timed.py" --label ''_validate-api/api: cargo clippy --locked --workspace --all-targets -- -D warnings'' --output "$GITHUB_WORKSPACE/artifacts/timings/$GITHUB_JOB.jsonl"
        -- bash --noprofile --norc -e -o pipefail "$script_file"

        '
      if: inputs.full && steps.native_cache.outputs.reuse != 'true'
    - name: Test and export the exact source contract
      if: steps.native_cache.outputs.reuse != 'true' && (!inputs.typescript_only || inputs.full || inputs.publish)
      run: 'script_file=$(mktemp)

        trap ''rm -f -- "$script_file"'' EXIT

        cat > "$script_file" <<''ERP_TIMED_7a9bcab76b275aff''

        mkdir -p artifacts/contracts

        ERP_OPENAPI_OUTPUT="$PWD/artifacts/contracts/candidate.json" ERP_COMPANY_CONTRACT_OUTPUT="$PWD/artifacts/contracts/company.json" cargo test --locked --workspace -- --test-threads=2

        test -s artifacts/contracts/candidate.json

        test -s artifacts/contracts/company.json

        ERP_TIMED_7a9bcab76b275aff

        python3 "$GITHUB_WORKSPACE/scripts/ci/timed.py" --label ''_validate-api/api: Test and export the exact source contract'' --output "$GITHUB_WORKSPACE/artifacts/timings/$GITHUB_JOB.jsonl"
        -- bash --noprofile --norc -e -o pipefail "$script_file"

        '
    - name: Verify TypeScript API with PostgreSQL
      env:
        API_TS_TEST_ADMIN_URL: postgres://postgres:ci_isolated_only@127.0.0.1:5432/postgres
      run: |
        python3 scripts/ci/timed.py --label 'api/typescript-install' --output "artifacts/timings/$GITHUB_JOB.jsonl" -- pnpm install --frozen-lockfile --prefer-offline
        python3 scripts/ci/timed.py --label 'api/typescript-typecheck' --output "artifacts/timings/$GITHUB_JOB.jsonl" -- pnpm --filter api-ts typecheck
        python3 scripts/ci/timed.py --label 'api/typescript-tests' --output "artifacts/timings/$GITHUB_JOB.jsonl" -- pnpm --filter api-ts test
    - name: Compare native and TypeScript HTTP contracts
      if: '!inputs.typescript_only || inputs.full || inputs.publish'
      env:
        API_TS_TEST_ADMIN_URL: postgres://postgres:ci_isolated_only@127.0.0.1:5432/postgres
        API_TS_TEST_RUST_BINARY: ${{ steps.native_cache.outputs.reference }}
        API_TS_TEST_GATEWAY_BINARY: ${{ steps.native_cache.outputs.gateway }}
      run: |
        python3 scripts/ci/timed.py --label 'api/rust-typescript-contracts' --output "artifacts/timings/$GITHUB_JOB.jsonl" -- pnpm --filter api-ts test:contracts
    - run: 'script_file=$(mktemp)

        trap ''rm -f -- "$script_file"'' EXIT

        cat > "$script_file" <<''ERP_TIMED_8752b798ea8bb621''

        cargo build --release --locked -p erp-next-api

        ERP_TIMED_8752b798ea8bb621

        python3 "$GITHUB_WORKSPACE/scripts/ci/timed.py" --label ''_validate-api/api: cargo build --release --locked -p erp-next-api'' --output "$GITHUB_WORKSPACE/artifacts/timings/$GITHUB_JOB.jsonl"
        -- bash --noprofile --norc -e -o pipefail "$script_file"

        '
      if: inputs.publish && steps.native_cache.outputs.reuse != 'true'
    - name: Publish api by immutable digest
      id: image
      if: inputs.publish && steps.native_cache.outputs.reuse != 'true'
      uses: docker/build-push-action@v6
      with:
        context: .
        file: deploy/api.Dockerfile
        push: true
        tags: ghcr.io/avilaops/erp-next-api:sha-${{ inputs.source_sha }}
    - name: Prepare fully validated native release cache
      if: inputs.publish && inputs.full && steps.native_cache.outputs.reuse != 'true'
      env:
        SOURCE_SHA: ${{ inputs.source_sha }}
        NATIVE_INPUT_HASH: ${{ steps.native_key.outputs.input_hash }}
        NATIVE_DIGEST: ${{ steps.image.outputs.digest }}
      run: node scripts/ci/native-release-cache.mjs save
    - name: Save validated native release
      if: inputs.publish && inputs.full && steps.native_cache.outputs.reuse != 'true' && steps.native_key.outputs.prefix != ''
      uses: actions/cache/save@v4
      with:
        path: artifacts/native-release-cache
        key: ${{ steps.native_key.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
    - uses: actions/upload-artifact@v4
      if: '!inputs.typescript_only || inputs.full || inputs.publish'
      with:
        name: erp-openapi-${{ inputs.source_sha }}-${{ github.run_attempt }}
        path: artifacts/contracts/
        if-no-files-found: error
        retention-days: 7
    - name: Preserve measured script durations
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: timing-_validate-api-api-${{ github.run_id }}-${{ github.run_attempt }}
        path: artifacts/timings/*.jsonl
        retention-days: 7
        if-no-files-found: warn
    outputs:
      digest: ${{ steps.native_cache.outputs.digest || steps.image.outputs.digest }}
      openapi_artifact_name: erp-openapi-${{ inputs.source_sha }}-${{ github.run_attempt }}
