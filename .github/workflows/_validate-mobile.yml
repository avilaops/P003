name: Validate mobile
# Apps nativos (D11). Gera builds de teste sem assinatura de loja: APK de debug e app do simulador.
# Publicação no teste interno do Play ou no TestFlight exige aprovação explícita e fica fora do CI de PR.
'on':
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.source_sha }}
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Conferir clientes gerados do OpenAPI
      run: |
        script_file=$(mktemp)
        trap 'rm -f -- "$script_file"' EXIT
        cat > "$script_file" <<'ERP_TIMED_cd407deaf21b0c96'
        node --test apps/mobile/contract/generate.test.mjs
        node apps/mobile/contract/generate.mjs --check
        ERP_TIMED_cd407deaf21b0c96
        python3 "$GITHUB_WORKSPACE/scripts/ci/timed.py" --label '_validate-mobile/contract: generate --check' --output "$GITHUB_WORKSPACE/artifacts/timings/$GITHUB_JOB.jsonl" -- bash --noprofile --norc -e -o pipefail "$script_file"
    - name: Preserve measured script durations
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: timing-validate-mobile-contract-${{ github.run_id }}-${{ github.run_attempt }}
        path: artifacts/timings/*.jsonl
        retention-days: 7
        if-no-files-found: warn
  android:
    needs:
    - contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.source_sha }}
        persist-credentials: false
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
    - uses: gradle/actions/setup-gradle@v4
    - name: Testar o núcleo e gerar o APK de homologação
      run: |
        script_file=$(mktemp)
        trap 'rm -f -- "$script_file"' EXIT
        cat > "$script_file" <<'ERP_TIMED_7326ca56930c6a39'
        ./gradlew --no-daemon :core:test :app:assembleDebug "-Perp.apiBaseUrl=$ERP_MOBILE_API_BASE_URL" "-Perp.versionCode=$GITHUB_RUN_NUMBER"
        ERP_TIMED_7326ca56930c6a39
        python3 "$GITHUB_WORKSPACE/scripts/ci/timed.py" --label '_validate-mobile/android: gradle test assembleDebug' --output "$GITHUB_WORKSPACE/artifacts/timings/$GITHUB_JOB.jsonl" -- bash --noprofile --norc -e -o pipefail "$script_file"
      env:
        ERP_MOBILE_API_BASE_URL: ${{ vars.ERP_MOBILE_API_BASE_URL }}
      working-directory: apps/mobile/android
    - name: Preservar o APK de teste
      uses: actions/upload-artifact@v4
      with:
        name: mobile-android-debug-${{ github.run_id }}-${{ github.run_attempt }}
        path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 14
        if-no-files-found: error
    - name: Preserve measured script durations
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: timing-validate-mobile-android-${{ github.run_id }}-${{ github.run_attempt }}
        path: artifacts/timings/*.jsonl
        retention-days: 7
        if-no-files-found: warn
  ios:
    needs:
    - contract
    runs-on: macos-15
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.source_sha }}
        persist-credentials: false
    - name: Gerar o projeto Xcode
      run: |
        script_file=$(mktemp)
        trap 'rm -f -- "$script_file"' EXIT
        cat > "$script_file" <<'ERP_TIMED_a4dcd51f4212f554'
        brew install xcodegen
        xcodegen generate
        ERP_TIMED_a4dcd51f4212f554
        python3 "$GITHUB_WORKSPACE/scripts/ci/timed.py" --label '_validate-mobile/ios: xcodegen' --output "$GITHUB_WORKSPACE/artifacts/timings/$GITHUB_JOB.jsonl" -- bash --noprofile --norc -e -o pipefail "$script_file"
      working-directory: apps/mobile/ios
    - name: Testar o núcleo no simulador
      run: |
        script_file=$(mktemp)
        trap 'rm -f -- "$script_file"' EXIT
        cat > "$script_file" <<'ERP_TIMED_ac05e919a9c58614'
        xcrun simctl list runtimes available
        runtime=$(xcrun simctl list runtimes available -j | python3 -c "import json,sys; r=[x for x in json.load(sys.stdin)['runtimes'] if x['platform']=='iOS']; print(sorted(r, key=lambda x: [int(n) for n in x['version'].split('.')])[-1]['identifier'])")
        device=$(xcrun simctl list devicetypes -j | python3 -c "import json,sys; print([x['identifier'] for x in json.load(sys.stdin)['devicetypes'] if 'iPhone' in x['name']][-1])")
        udid=$(xcrun simctl create erp-ci "$device" "$runtime")
        xcodebuild test -project ErpMobile.xcodeproj -scheme ErpMobile -destination "id=$udid" CODE_SIGNING_ALLOWED=NO
        ERP_TIMED_ac05e919a9c58614
        python3 "$GITHUB_WORKSPACE/scripts/ci/timed.py" --label '_validate-mobile/ios: xcodebuild test' --output "$GITHUB_WORKSPACE/artifacts/timings/$GITHUB_JOB.jsonl" -- bash --noprofile --norc -e -o pipefail "$script_file"
      working-directory: apps/mobile/ios
    - name: Gerar o app de homologação para simulador
      run: |
        script_file=$(mktemp)
        trap 'rm -f -- "$script_file"' EXIT
        cat > "$script_file" <<'ERP_TIMED_69d7a632c340562c'
        xcodebuild build -project ErpMobile.xcodeproj -scheme ErpMobile -configuration Release -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO "ERP_API_BASE_URL=$ERP_MOBILE_API_BASE_URL"
        ditto -c -k --keepParent build/Build/Products/Release-iphonesimulator/ErpMobile.app ErpMobile-simulator.zip
        ERP_TIMED_69d7a632c340562c
        python3 "$GITHUB_WORKSPACE/scripts/ci/timed.py" --label '_validate-mobile/ios: xcodebuild build' --output "$GITHUB_WORKSPACE/artifacts/timings/$GITHUB_JOB.jsonl" -- bash --noprofile --norc -e -o pipefail "$script_file"
      env:
        ERP_MOBILE_API_BASE_URL: ${{ vars.ERP_MOBILE_API_BASE_URL }}
      working-directory: apps/mobile/ios
    - name: Preservar o app de teste
      uses: actions/upload-artifact@v4
      with:
        name: mobile-ios-simulator-${{ github.run_id }}-${{ github.run_attempt }}
        path: apps/mobile/ios/ErpMobile-simulator.zip
        retention-days: 14
        if-no-files-found: error
    - name: Preserve measured script durations
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: timing-validate-mobile-ios-${{ github.run_id }}-${{ github.run_attempt }}
        path: artifacts/timings/*.jsonl
        retention-days: 7
        if-no-files-found: warn
