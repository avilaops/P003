name: Claude Code
# Agente do Claude Code que trabalha nos PRs e issues quando alguém escreve @claude.
# Só responde a quem tem acesso de escrita (OWNER, MEMBER ou COLLABORATOR).
# Nunca publica: sem environment, sem acesso a produção, sem segredos de deploy.
# Commits ficam na branch do próprio PR; o merge na main continua manual.
'on':
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write
# Um agente por PR/issue de cada vez; pedidos novos esperam o atual terminar.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  claude:
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
      )
    runs-on: ubuntu-latest
    # Limite do runner hospedado é 6 h; PRs grandes podem precisar de "@claude continue".
    timeout-minutes: 350
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: erp_next_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_isolated_only
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:ci_isolated_only@127.0.0.1:5432/erp_next_test
      API_TS_TEST_ADMIN_URL: postgres://postgres:ci_isolated_only@127.0.0.1:5432/postgres
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: pnpm/action-setup@v4
      with:
        version: 11.11.0
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
    - name: Install workspace dependencies
      run: pnpm install --frozen-lockfile
    - name: Run Claude Code
      uses: anthropics/claude-code-action@v1
      with:
        # Usa somente a assinatura Claude (Pro/Max), sem cobrança de API.
        # Segredo CLAUDE_CODE_OAUTH_TOKEN, gerado com `claude setup-token`.
        # Não há chave de API aqui de propósito: o uso conta no limite da assinatura.
        claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        additional_permissions: |
          actions: read
        claude_args: |
          --model claude-sonnet-5-5
          --max-turns 400
          --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebFetch,WebSearch,TodoWrite"
          --append-system-prompt "Siga o AGENTS.md e o CLAUDE.md do repositório. Trabalhe somente na branch do PR em que foi chamado. Nunca faça merge, nunca faça push na main, nunca altere a política de release nem o teste test_release_deploys_every_main_merge_and_is_serialized, e nunca publique nada em produção. Escreva commits e comentários em português."
